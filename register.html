<h1 class="form1">Student Registration Form</h1>
<div class="personal">
    <h2 class="details">Personal Details</h2>
    <label for="Name" class="name1">Name <span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="text" id="text" class="name" placeholder="    Enter your name">
    <br><br>
     <label for="email" class="email1">Email <span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="email" id="text" class="email" placeholder="    Enter your email">
    <label for="phone" class="phone1">Phone <span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="text" id="number" class="phone" placeholder="    Enter your Phone Number">
    <label for="password" class="password1">Password <span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="password" id="password" class="password" placeholder="    Enter your password">
    <label for="date" class="date1">Date of Birth <span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="date" id="date" class="date" placeholder="    Enter your password">
    <label class="gender">Gender<span style="color: red;">*</span></label>
    <label class="male">
        <input type="radio" name="gender">Male
    </label>
    <label class="Female">
        <input type="radio" name="gender">Female
    </label>
</div>
<div class="your">
    <h2 class="Select3">Course & Skills</h2>
    <label for="Select" class="Select">Course<span style="color: red; font-size: 30px;">*</span></label><br>
    <select class="select1">
        <option >Select your course</option>
        <option value="#">BCA</option>
        <option value="#">MCA</option>
        <option value="#">BBA</option>
        <option value="#">B.COM</option>

    </select>
    <label for="multi" class="multi">Skills (Select multiple)<span style="color: red; font-size: 30px;">*</span></label><br>
    <input type="checkbox" name="html" id="html" class="S"><label for="text" class="S5">HTML</label><br>
    <input type="checkbox" name="html" id="html" class="S1"><label for="multi" class="S6">CSS</label><br>
    <input type="checkbox" name="html" id="html" class="S2"><label for="multi" class="S7">JavaScript</label><br>
    <input type="checkbox" name="html" id="html" class="S3"><label for="multi" class="S8">Python</label><br>
    <input type="checkbox" name="html" id="html" class="S4"><label for="multi" class="S9">Flutter</label>
    <label for="resume" class="resume">Resume<span style="color: red; font-size: 30px;">*</span></label>
    <input type="file" multiple="2" class="resume1">
</div>
<div class="form">
    <h2 class="add">Address</h2>
    <label for="add" class="add1">Street Address<span style="color: red; font-size: 30px;">*</span></label>
    <input type="text" class="add2" placeholder="Enter your address">
    <label for="add" class="city">City<span style="color: red; font-size: 30px;">*</span></label>
    <input type="text" class="city2" placeholder="Enter your City">
    <label for="add" class="state">State<span style="color: red; font-size: 30px;">*</span></label>
    <input type="text" class="state2" placeholder="Enter your State">
    <label for="add" class="pin1">Pincode<span style="color: red; font-size: 30px;">*</span></label>
    <input type="number" class="pin2" placeholder="Enter your pincode">
</div>
